services:

  # ==========================================================
  # TAILSCALE
  # ==========================================================

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-project-zomboid
    hostname: project_projectz-pollito
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
    volumes:
      - ./data/project-zomboid/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true

  # ==========================================================
  # PROJECT ZOMBOID
  # ==========================================================

  projectzomboid:
    image: indifferentbroccoli/projectzomboid-server-docker:latest
    container_name: project-zomboid
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      TZ: Europe/Madrid
    volumes:
      - ./data/project-zomboid/server-files:/project-zomboid
      - ./data/project-zomboid/server-data:/project-zomboid-config
    network_mode: "service:tailscale"
    mem_limit: 5g
    depends_on:
      - tailscale

  # ==========================================================
  # DOCKER SOCKET PROXY (PERSONALIZADO)
  # ==========================================================

  docker-socket-proxy:
    build: ./proxy
    container_name: pz-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      ALLOWED_CONTAINER: project-zomboid
      PROXY_PORT: "2375"
    networks:
      - pz-internal

  # ==========================================================
  # TELEGRAM BOT
  # ==========================================================

  telegram-bot:
    build: ./bot
    container_name: pz-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PZ_CONTAINER: project-zomboid
      PZ_DB_PATH: /pz-data/db/server-zomboid.db
      DOCKER_HOST: http://docker-socket-proxy:2375
    volumes:
      - ./data/project-zomboid/server-data:/pz-data:ro
    depends_on:
      - projectzomboid
      - docker-socket-proxy
    networks:
      - pz-internal

networks:
  pz-internal:
    driver: bridge